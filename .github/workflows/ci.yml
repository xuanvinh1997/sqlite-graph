name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: make test
      - name: Loadable build (Linux)
        if: runner.os == 'Linux'
        run: make test-loadable
      - name: Loadable build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite
          make loadable SQLITE_INCLUDE="$(brew --prefix sqlite)/include"
